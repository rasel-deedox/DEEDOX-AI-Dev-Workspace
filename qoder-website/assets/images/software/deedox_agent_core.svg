<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 656 636" width="656" height="636">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#255A41" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0F172A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#080809" stop-opacity="0.95" />
    </radialGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80C776" />
      <stop offset="50%" stop-color="#255A41" />
      <stop offset="100%" stop-color="#143826" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect x="18" y="18" width="620" height="600" rx="28" fill="url(#bgGlow)" stroke="rgba(128,199,118,0.25)" stroke-width="2" />

  <!-- Outer Orbit Ring -->
  <circle cx="328" cy="318" r="230" fill="none" stroke="rgba(128,199,118,0.15)" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="328" cy="318" r="170" fill="none" stroke="rgba(56,189,248,0.2)" stroke-width="2" />

  <!-- 7 Agent Nodes (Roundtable Consensus Council) -->
  <!-- Node 1: Master Orchestrator (Top) -->
  <line x1="328" y1="318" x2="328" y2="108" stroke="rgba(128,199,118,0.4)" stroke-width="2" />
  <circle cx="328" cy="108" r="24" fill="#143826" stroke="#80C776" stroke-width="3" filter="url(#glow)" />
  <text x="328" y="114" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">MASTER</text>

  <!-- Node 2: Architect (Top-Right) -->
  <line x1="328" y1="318" x2="495" y2="185" stroke="rgba(56,189,248,0.4)" stroke-width="2" />
  <circle cx="495" cy="185" r="20" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5" />
  <text x="495" y="190" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#E2E8F0" text-anchor="middle">ARCH</text>

  <!-- Node 3: Frontend (Right) -->
  <line x1="328" y1="318" x2="528" y2="350" stroke="rgba(128,199,118,0.4)" stroke-width="2" />
  <circle cx="528" cy="350" r="20" fill="#143826" stroke="#80C776" stroke-width="2.5" />
  <text x="528" y="355" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#E2E8F0" text-anchor="middle">UI/UX</text>

  <!-- Node 4: Backend (Bottom-Right) -->
  <line x1="328" y1="318" x2="445" y2="490" stroke="rgba(56,189,248,0.4)" stroke-width="2" />
  <circle cx="445" cy="490" r="20" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5" />
  <text x="445" y="495" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#E2E8F0" text-anchor="middle">API</text>

  <!-- Node 5: Security Auditor (Bottom-Left) -->
  <line x1="328" y1="318" x2="211" y2="490" stroke="rgba(244,63,94,0.4)" stroke-width="2" />
  <circle cx="211" cy="490" r="20" fill="#1C1917" stroke="#F43F5E" stroke-width="2.5" />
  <text x="211" y="495" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#E2E8F0" text-anchor="middle">SEC</text>

  <!-- Node 6: DevOps / Pulse (Left) -->
  <line x1="328" y1="318" x2="128" y2="350" stroke="rgba(128,199,118,0.4)" stroke-width="2" />
  <circle cx="128" cy="350" r="20" fill="#143826" stroke="#80C776" stroke-width="2.5" />
  <text x="128" y="355" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#E2E8F0" text-anchor="middle">PULSE</text>

  <!-- Node 7: QA & Bug Hunter (Top-Left) -->
  <line x1="328" y1="318" x2="161" y2="185" stroke="rgba(245,158,11,0.4)" stroke-width="2" />
  <circle cx="161" cy="185" r="20" fill="#1E1B4B" stroke="#F59E0B" stroke-width="2.5" />
  <text x="161" y="190" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#E2E8F0" text-anchor="middle">QA</text>

  <!-- Central Nexus Core -->
  <circle cx="328" cy="318" r="88" fill="url(#emeraldGrad)" stroke="#80C776" stroke-width="4" filter="url(#glow)" />
  <circle cx="328" cy="318" r="76" fill="#0A1810" />

  <!-- Core Emblem Graphic -->
  <path d="M328 268 L368 288 L368 348 L328 368 L288 348 L288 288 Z" fill="none" stroke="#80C776" stroke-width="3" />
  <polygon points="328 280 354 295 354 335 328 350 302 335 302 295" fill="rgba(128,199,118,0.2)" />
  <circle cx="328" cy="315" r="14" fill="#80C776" />

  <!-- Central Title Text -->
  <text x="328" y="338" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">DEEDOX</text>

  <!-- Header & Footer Badges -->
  <rect x="208" y="44" width="240" height="28" rx="14" fill="rgba(37,90,65,0.4)" stroke="rgba(128,199,118,0.4)" />
  <text x="328" y="63" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="800" fill="#80C776" text-anchor="middle" letter-spacing="1">7-AGENT CONSENSUS CORE</text>

  <rect x="188" y="556" width="280" height="28" rx="14" fill="rgba(15,23,42,0.8)" stroke="rgba(56,189,248,0.3)" />
  <text x="328" y="575" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="0.5">SOVEREIGN AIR-GAPPED EXECUTION</text>
</svg>